<!doctype html>
<html lang="en">
  <head>
    <title>RocketRide</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="RocketRide" />
    <link rel="icon" href="/shell/favicon.svg" type="image/svg+xml" />
    <!-- FOUC guard: inline mirror of shared-ui themes/themePreference.ts
         precedence (rr:theme primary, rr:home:theme mode-hint fallback) —
         keep the two in sync. Inline because modules can't load this early. -->
    <script>(function(){try{var t=localStorage.getItem('rr:theme'),h=localStorage.getItem('rr:home:theme');var d=t?(t!=='rocketride-light'&&t!=='light'):h==='dark';if(d){document.documentElement.style.setProperty('--rr-bg-default','#080808');document.documentElement.style.background='#080808';}}catch(e){}})();</script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
