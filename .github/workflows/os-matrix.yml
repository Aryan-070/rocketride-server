name: OS Matrix — compile + test

# Verifies the engine compiles and its unit tests pass across the Linux distros
# we support. This is deliberately NOT a per-PR check — it builds vcpkg deps
# from source per distro, so it is slow. It runs on-demand (Actions ▸ Run
# workflow) and on a monthly schedule. `fail-fast: false` so every distro
# reports its own pass/fail even when one breaks — the whole point is to see
# *which* OS regressed.
#
# Toolchain install is delegated to scripts/compiler-unix.sh (the project's
# single cross-distro apt|dnf source of truth), so this matrix inherits new
# build deps automatically.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 1 * *' # 06:00 UTC on the 1st of each month

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}
  # Non-interactive apt so tzdata/debconf never block the install in a container
  # with no tty (harmless on the dnf distros).
  DEBIAN_FRONTEND: noninteractive
  # Build every vcpkg dependency from source on each distro (no binary cache) —
  # that is the actual cross-OS compile test. A read-only nuget cache can be
  # layered in later to speed up the triplet-matching legs.
  VCPKG_BINARY_SOURCES: clear

jobs:
  os-matrix:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: ${{ matrix.image }}
      volumes:
        - /mnt:/mnt
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:22.04
          - ubuntu:24.04
          - ubuntu:26.04
          - fedora:latest
          - almalinux:10 # RHEL-compatible
    steps:
      # TEMP probe: measure the container root disk and the mounted host /mnt on
      # every distro, then stop. No build/test — revert this commit to restore the
      # real pipeline.
      - name: Report disk size
        shell: sh
        run: |
          echo "### $(. /etc/os-release 2>/dev/null; echo "$PRETTY_NAME") ###"
          echo "--- df -h (all filesystems) ---"
          df -h || true
          echo "--- / and /mnt only ---"
          df -h / /mnt 2>/dev/null || true
